<p class="group-label" [id]="labelId">{{ label() }}</p>
<div class="pills" role="radiogroup" [attr.aria-labelledby]="labelId">
  @for (option of options(); track option.id; let index = $index) {
    <button
      #option
      type="button"
      role="radio"
      class="pill"
      [attr.aria-checked]="option.id === checked()"
      [attr.aria-disabled]="!option.available"
      [attr.tabindex]="index === focusable() ? 0 : -1"
      [attr.title]="option.hint"
      [attr.aria-label]="option.hint ? option.label + ', ' + option.hint : null"
      (click)="choose(option)"
      (keydown)="move($event, index)"
    >
      {{ option.label }}
    </button>
  }
</div>
