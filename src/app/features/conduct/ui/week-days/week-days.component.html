<ui-section-card heading="Les jours de la semaine" icon="calendar" [level]="3" [lift]="true">
  <ul class="tiles">
    @for (tile of tiles(); track tile.date) {
      <li [class]="'tile state-' + tile.state">
        <span class="visually-hidden">{{ tile.name }}</span>
        <span class="day" aria-hidden="true">{{ tile.label }}</span>
        @if (tile.word) {
          <span class="word" aria-hidden="true">
            <span class="dot"></span>
            {{ tile.word }}
          </span>
        }
      </li>
    }
  </ul>
</ui-section-card>
