<section aria-labelledby="attendance-header-title">
  <div class="band">
    <h2 id="attendance-header-title">Taux de présence</h2>
    <p class="since">{{ since() }}</p>
  </div>
  <div class="body">
    <p class="rate">
      <span class="value">{{ rate() }}</span>
      <span class="days">{{ days() }}</span>
    </p>
    <dl class="counters">
      @for (counter of counters(); track counter.label) {
        <div [class]="'counter tone-' + counter.tone">
          <dt>{{ counter.label }}</dt>
          <dd>{{ counter.value }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
