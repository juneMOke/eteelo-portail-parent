@if (week(); as week) {
  @if (resource.stale()) {
    <ui-stale-notice (retry)="resource.reload()" />
  }
  <ui-week-banner
    [label]="label()"
    [shortLabel]="shortLabel()"
    [relative]="relative()"
    [hasPrevious]="week.weekStart > week.firstWeek"
    [hasNext]="week.weekStart < week.currentWeek"
    [isCurrent]="week.weekStart === week.currentWeek"
    [wide]="wide()"
    currentLabel="Revenir à aujourd’hui"
    [announcement]="label() + ', ' + summary()"
    (step)="step($event, week)"
    (current)="selectWeek(week.currentWeek)"
  />
  <p class="summary">{{ summary() }}</p>

  <ui-swipe-pager
    [position]="week.weekStart"
    label="Évaluations de la semaine"
    [attr.aria-busy]="loading()"
    (swipe)="step($event, week)"
  >
    @for (day of days(); track day.date) {
      <section class="day" [attr.aria-labelledby]="'day-' + day.date">
        <h2 class="day-heading" [id]="'day-' + day.date">{{ day.label }}</h2>
        <ul class="cards">
          @for (item of day.items; track item.evaluationId) {
            <li [uiRefreshHighlight]="item" [refreshed]="resource.refreshed()">
              <app-result-card
                [evaluation]="item"
                [link]="cardLink(item)"
                [queryParams]="cardQueryParams(week)"
              />
            </li>
          }
        </ul>
      </section>
    } @empty {
      <ui-empty-period
        heading="Aucune évaluation cette semaine"
        [linkLabel]="lastEvaluationLabel()"
        [queryParams]="{ date: week.lastEvaluationDate }"
        message="Les notes apparaîtront ici dès que l’école les publiera."
        (linkClick)="focusBanner()"
      />
    }
  </ui-swipe-pager>
} @else if (resource.error()) {
  <ui-load-error
    heading="Impossible d’afficher les notes"
    message="Les notes nécessitent une connexion. Vérifiez-la, puis réessayez."
    (retry)="resource.reload()"
  />
} @else {
  <div class="loading" role="status" aria-busy="true">
    <span class="visually-hidden">Chargement des notes…</span>
    <ui-skeleton height="56px" />
    <ui-skeleton width="40%" height="16px" />
    <ui-skeleton height="180px" />
    <ui-skeleton height="180px" />
  </div>
}
