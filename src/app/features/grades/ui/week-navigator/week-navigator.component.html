<ui-period-navigator
  [label]="label()"
  [meta]="summary()"
  previousLabel="Semaine précédente"
  nextLabel="Semaine suivante"
  [hasPrevious]="hasPrevious()"
  [hasNext]="hasNext()"
  [value]="week().weekStart"
  [min]="week().firstWeek"
  [max]="lastDay()"
  currentLabel="Cette semaine"
  [showCurrent]="week().weekStart !== week().currentWeek"
  [announcement]="label() + ', ' + summary()"
  (step)="step($event)"
  (pick)="weekChange.emit($event)"
  (current)="weekChange.emit(week().currentWeek)"
/>
