<app-term-options
  class="inline"
  [periods]="periods()"
  [periodId]="selection().periodId"
  [part]="selection().part"
  (termPick)="pickTerm($event)"
  (partPick)="pickPart($event)"
/>

<button type="button" class="compact" aria-haspopup="dialog" (click)="openSheet()">
  <span class="visually-hidden">Période affichée :</span>
  <span class="compact-label">{{ selection().label }}</span>
  <ui-icon name="chevron-down" [size]="18" [strokeWidth]="2" />
  <span class="visually-hidden">. Changer</span>
</button>

<ui-sheet heading="Choisir la période">
  <app-term-options
    [periods]="periods()"
    [periodId]="draftTerm()"
    [part]="draftPart()"
    (termPick)="draftTerm.set($event)"
    (partPick)="pickDraftPart($event)"
  />
</ui-sheet>
