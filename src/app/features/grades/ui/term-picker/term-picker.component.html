@if (wide()) {
  <app-term-options
    class="inline"
    [periods]="periods()"
    [periodId]="selection().periodId"
    [part]="selection().part"
    (termPick)="pickTerm($event)"
    (partPick)="pickPart($event)"
  />
} @else {
  <ui-filter-menu
    [caption]="unitLabel()"
    [options]="termOptions()"
    [checked]="selection().periodId"
    [open]="openMenu() === 'term'"
    (openChange)="setMenu('term', $event)"
    (pick)="pickTerm($event)"
  />
  <ui-filter-menu
    caption="Période"
    [options]="partOptions()"
    [checked]="selection().part"
    [open]="openMenu() === 'part'"
    (openChange)="setMenu('part', $event)"
    (pick)="pickPart($event)"
  />
}
