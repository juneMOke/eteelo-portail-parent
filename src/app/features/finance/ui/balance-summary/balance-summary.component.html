<div class="band">
  <p class="year">Année {{ yearLabel() }}</p>
  <p class="as-of">{{ asOfText() }}</p>
</div>
<div class="body">
  @for (block of blocks(); track block.currency) {
    <div class="block">
      @if (block.settled) {
        <p class="settled">Rien à payer pour le moment.</p>
      } @else {
        <p class="remaining">
          <span class="figure">{{ block.remaining }}</span>&ngsp;<span class="word"
            >restant sur l’année</span
          >
        </p>
      }
      <span class="gauge" aria-hidden="true">
        <span class="filled" [style.width.%]="block.share * 100"></span>
      </span>
      <p class="paid">{{ block.paidOverExpected }}</p>
      <dl class="boxes">
        <div class="box total">
          <dt>Total de l’année</dt>
          <dd>{{ block.expected }}</dd>
        </div>
        <div class="box paid-box">
          <dt>Versé</dt>
          <dd>{{ block.paid }}</dd>
        </div>
      </dl>
    </div>
  }
</div>
