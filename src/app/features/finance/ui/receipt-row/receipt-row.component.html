<span class="tile" aria-hidden="true"
  ><ui-icon name="file-text" [size]="21" [strokeWidth]="1.8"
/></span>
<p class="name">
  @if (receiptNumber(); as number) {
    Reçu n° <span class="number">{{ number }}</span>
  } @else {
    Reçu en préparation
  }
</p>
<p class="meta">
  {{ meta() }}
  @if (fees(); as fees) {
    <span class="fees">· {{ fees }}</span>
  }
</p>
<p class="amount">{{ payment().amounts | amount }}</p>
@if (receiptNumber(); as number) {
  <app-receipt-actions
    class="actions"
    [href]="href()"
    [receiptNumber]="number"
    [sharing]="sharing()"
    (share)="share.emit()"
  />
} @else {
  <p class="recorded">{{ recordedOn() }}</p>
}
