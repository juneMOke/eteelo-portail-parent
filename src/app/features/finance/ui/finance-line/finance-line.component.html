@let item = line();
<button type="button" class="line" [attr.aria-label]="item.spoken" (click)="activate.emit()">
  @if (item.icon; as icon) {
    <span class="icon"><ui-icon [name]="icon" [size]="21" [strokeWidth]="1.8" /></span>
  }
  @if (item.status; as status) {
    <ui-badge class="status" [tone]="status.tone"
      ><span class="dot"></span>{{ status.label }}</ui-badge
    >
  }
  <span class="heading" [class.full]="!!item.compactHeading">{{ item.heading }}</span>
  @if (item.compactHeading; as compact) {
    <span class="compact-heading" aria-hidden="true">{{ compact }}</span>
  }
  @if (item.details.length) {
    <span class="details">
      @for (detail of item.details; track detail) {
        <span>{{ detail }}</span>
      }
    </span>
  }
  @if (item.progress !== null) {
    <span class="progress">
      <span class="gauge"><span class="filled" [style.width.%]="item.progress * 100"></span></span>
      @if (item.progressNote; as note) {
        <span class="progress-note">{{ note }}</span>
      }
    </span>
  }
  <span class="money">
    <span class="amount">{{ item.amounts | amount }}</span>
    @if (item.amountNote; as note) {
      <span class="note">{{ note }}</span>
    }
  </span>
  <span class="chevron"><ui-icon name="chevron-right" [size]="16" [strokeWidth]="2.2" /></span>
</button>
