@if (data(); as data) {
  @if (data.fees.length) {
    <app-balance-summary
      [yearLabel]="yearLabel()"
      [totals]="data.totals"
      [asOf]="data.asOf"
      [count]="feesCount()"
    />

    @if (overdue().length) {
      <app-overdue-banner
        [headline]="headline()"
        [fees]="overdue()"
        (pay)="payOverdue()"
        (more)="showFeeList()"
      />
    }

    <ui-section-card
      #feeList
      heading="Les frais de l’année"
      icon="receipt"
      [count]="feesCount()"
      [countAlert]="overdueCount()"
    >
      <ul class="rows" [attr.aria-busy]="resource.isLoading()">
        @for (item of lines(); track item.id) {
          <li><app-finance-line [line]="item.line" (activate)="fiche.show(item.id)" /></li>
        }
      </ul>
    </ui-section-card>
  } @else {
    <ui-empty-period
      [heading]="'Les frais de l’année ' + yearLabel() + ' seront publiés par l’école.'"
    />
  }

  <app-fee-sheet
    [childId]="childId()"
    [fee]="openFee()"
    (closed)="fiche.dismiss()"
    (pay)="payFee($event)"
  />
  <app-how-to-pay-sheet
    [fee]="payingFee()"
    [overdueAmount]="payingAmount()"
    [childName]="childName()"
    [phone]="schoolPhone()"
    [fromFee]="payingFromFee()"
    (back)="backToFee()"
  />
} @else if (resource.error()) {
  <ui-load-error
    heading="Impossible d’afficher les frais"
    message="Mes frais nécessite une connexion. Vérifiez-la, puis réessayez."
    (retry)="resource.reload()"
  />
} @else {
  <div class="loading" role="status" aria-busy="true">
    <span class="visually-hidden">Chargement des frais…</span>
    <ui-skeleton class="summary" height="252px" />
    <ui-skeleton height="88px" />
    <ui-skeleton height="88px" />
    <ui-skeleton height="88px" />
  </div>
}
