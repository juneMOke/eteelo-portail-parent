@if (data(); as data) {
  @if (resource.stale()) {
    <ui-stale-notice (retry)="resource.reload()" />
  }
  @if (showBanner()) {
    <app-year-banner
      [years]="years.choices()"
      [checked]="years.checked()"
      [countLabel]="paymentsCount()"
      [latestLabel]="latestPayment()"
      [count]="payments().length"
      unit="versements"
      [wide]="years.wide()"
      (pick)="years.pick($event)"
    />
  }

  <div class="cards" [attr.aria-busy]="resource.isLoading()">
    @for (month of months(); track month.month) {
      <ui-section-card [heading]="month.label" icon="calendar" [count]="month.count">
        <ul class="rows">
          @for (item of month.lines; track item.id) {
            <li [uiRefreshHighlight]="item.line" [refreshed]="resource.refreshed()">
              <app-finance-line [line]="item.line" (activate)="fiche.show(item.id)" />
            </li>
          }
        </ul>
      </ui-section-card>
    } @empty {
      <ui-empty-period
        [heading]="emptyHeading()"
        [linkLabel]="feesLinkLabel()"
        [link]="feesLink()"
      />
    }
  </div>

  <app-payment-sheet
    [childId]="childId()"
    [payment]="openPayment()"
    [receiptHref]="receiptHref()"
    [sharing]="sharing()"
    [failure]="failure()"
    (closed)="fiche.dismiss()"
    (share)="share($event)"
  />
} @else if (resource.error()) {
  <ui-load-error
    heading="Impossible d’afficher les paiements"
    message="Mes paiements nécessite une connexion. Vérifiez-la, puis réessayez."
    (retry)="resource.reload()"
  />
} @else {
  <div class="loading" role="status" aria-busy="true">
    <span class="visually-hidden">Chargement des paiements…</span>
    <ui-skeleton class="banner" height="68px" />
    <ui-skeleton class="month" height="48px" />
    <ui-skeleton height="68px" />
    <ui-skeleton height="68px" />
    <ui-skeleton height="68px" />
  </div>
}

<app-saved-toast />
