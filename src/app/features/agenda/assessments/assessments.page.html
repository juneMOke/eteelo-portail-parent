@if (data(); as list) {
  <app-week-board
    [window]="list"
    [cards]="cards()"
    [labels]="labels"
    [listLink]="listLink()"
    [week]="week()"
    [day]="day()"
    [status]="status()"
    [viewParam]="view()"
    [date]="date()"
  />
} @else if (list.error()) {
  <ui-empty-state
    icon="info"
    heading="Impossible d’afficher les évaluations"
    message="Vérifiez votre connexion, puis réessayez."
  >
    <button type="button" class="button" (click)="list.reload()">Réessayer</button>
  </ui-empty-state>
} @else {
  <div class="loading" role="status" aria-busy="true">
    <span class="visually-hidden">Chargement des évaluations…</span>
    <ui-skeleton height="56px" />
    <ui-skeleton height="48px" />
    <ui-skeleton height="48px" />
    <ui-skeleton height="160px" />
  </div>
}
