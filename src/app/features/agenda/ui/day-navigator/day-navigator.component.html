<ui-period-navigator
  [label]="label()"
  [meta]="meta()"
  previousLabel="Jour précédent"
  nextLabel="Jour suivant"
  [hasPrevious]="!!previous()"
  [hasNext]="!!next()"
  [value]="day()"
  [min]="window().from"
  [max]="window().to"
  currentLabel="Aujourd’hui"
  [showCurrent]="showToday()"
  [announcement]="announcement()"
  (step)="step($event)"
  (pick)="dayChange.emit($event)"
  (current)="dayChange.emit(window().today)"
/>
