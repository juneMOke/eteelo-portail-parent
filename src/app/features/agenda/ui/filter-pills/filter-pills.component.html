<div class="pills" role="radiogroup" [attr.aria-label]="label()">
  @for (option of options(); track option.id; let index = $index) {
    <button
      #option
      type="button"
      role="radio"
      class="pill"
      [attr.aria-checked]="option.id === checked()"
      [attr.tabindex]="index === focusable() ? 0 : -1"
      (click)="pick.emit(option.id)"
      (keydown)="move($event, index)"
    >
      @if (option.tone; as tone) {
        <span class="dot" [style.background]="'var(--color-tone-' + tone + ')'"></span>
      }
      {{ option.label }}
      <span class="count"><span class="visually-hidden">, </span>{{ option.count }}</span>
    </button>
  }
</div>
