<app-day-navigator
  [day]="day()"
  [window]="window()"
  [summary]="summary()"
  (dayChange)="select($event)"
/>

<ui-swipe-pager [position]="day()" [label]="labels().region" (swipe)="onSwipe($event)">
  @if (count()) {
    <ng-content />
  } @else {
    <ui-empty-period
      class="empty-day"
      [heading]="schoolDay() ? labels().emptyDay : 'Pas d’école ce jour'"
      [linkLabel]="nextDayLabel()"
      [queryParams]="{ date: nextDay() }"
      message="Rien n’est prévu pour les quatre prochaines semaines."
      (linkClick)="focusNavigator()"
    />
  }
</ui-swipe-pager>
