<h3 class="heading">{{ heading() }}</h3>

<div class="row">
  <span class="icon"><ui-icon name="file-text" [size]="20" /></span>
  <span class="file">
    <span class="name" [title]="document().fileName">{{ name() }}</span>
    <span class="meta">
      {{ meta() }} · {{ dateLabel() }} {{ document().publishedAt | date: dateFormat() }}
    </span>
  </span>
  <a
    class="open"
    [href]="document().href"
    target="_blank"
    rel="noopener"
    [attr.aria-label]="'Consulter ' + document().fileName"
  >
    Consulter
  </a>
</div>
