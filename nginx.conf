# Portail parent : fichiers statiques du build Angular, fallback SPA.
# /api n'arrive pas ici : le reverse proxy de l'environnement l'envoie à Spring.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # nginx:alpine n'active pas gzip : en 3G, c'est le premier poste de coût.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Santé du conteneur (HEALTHCHECK du Dockerfile) et du routage public (déploiement).
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Point d'entrée et service worker : toujours revalidés, sinon un parent reste sur une ancienne version.
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers hashés par le build (outputHashing: all) : immuables.
    # Un chunk absent (ancienne version) renvoie 404, jamais index.html servi comme du JS.
    location ~ "^/(main|polyfills|styles|chunk|worker)-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Ne jamais renvoyer l'application à la place d'une réponse d'API.
    location /api/ {
        return 404;
    }

    # Le mime.types de nginx ne connaît pas l'extension .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Autres fichiers (polices, icônes, manifeste, favicon) : non hashés, cache court.
    location ~ \.[A-Za-z0-9]+$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Routes de l'application (/c/:childId/…, /login/:token…) : fallback SPA.
    location / {
        try_files $uri /index.html;
    }
}
